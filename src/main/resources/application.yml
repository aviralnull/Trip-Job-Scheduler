server:
  port: 8080
spring:
  application:
    name: distributed-trip-job-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripscheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
scheduler:
  dispatch-poll-ms: 100
  outbox-poll-ms: 250
  lease-ttl-seconds: 15
logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
